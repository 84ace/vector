services:
  vector-c2-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vector-c2-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ID=nas-local-node-8080
      # This file serves plaintext ws://, which the client permits only to a
      # private-network address. To serve wss://, overlay docker-compose.tls.yml
      # rather than editing this file:
      #
      #   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
      #
      # Without TLS the node still cannot read message bodies, but routing
      # metadata — who is talking to whom, and when — is exposed to the network
      # path. See ../DEPLOYMENT.md.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
