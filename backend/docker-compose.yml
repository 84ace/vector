version: '3.8'

services:
  vector-c2-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vector-c2-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ID=nas-local-node-8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
